<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- Base rounded rectangle background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Tree Structure Motif -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Smooth branching stem -->
    <path d="M 256,150 L 256,230 C 256,290 160,290 160,350" fill="none" stroke="#FFFFFF" stroke-width="22"/>
    <path d="M 256,230 C 256,290 352,290 352,350" fill="none" stroke="#FFFFFF" stroke-width="22"/>

    <!-- Bottom Left Node -->
    <circle cx="160" cy="350" r="12" fill="#FFFFFF"/>
    <!-- Bottom Right Node -->
    <circle cx="352" cy="350" r="12" fill="#FFFFFF"/>
    <!-- Top Root Node (Gold Accent) -->
    <circle cx="256" cy="150" r="16" fill="#E8B838" stroke="#FFFFFF" stroke-width="4"/>
  </g>
</svg>
